<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>My Profile</h1>

        <form id="profileForm">
            <label for="nameInput">Username</label>
            <input type="text" id="nameInput" required>

            <label for="yearInput">Birth Year</label>
            <input type="number" id="yearInput" min="1900" required>

            <button type="submit">Create / Update Profile</button>
        </form>

        <p id="profileInfo"></p>

        <h2>Hobbies</h2>
        <label for="hobbyInput">New hobby</label>
        <input type="text" id="hobbyInput" placeholder="Enter a hobby">

        <button type="button" id="addButton">Add Item</button>
        <button type="button" id="removeButton">Remove Item</button>

        <ul id="hobbyList"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
